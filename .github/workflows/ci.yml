name: check

# Runs on every push and PR, with no API key or secrets, so it works on forks. It can't do
# the paid end-to-end run (npm run selftest, ~$0.002, needs a key); it covers every regression
# that has shipped: a provider missing available(), a bad raw: pointer, unparseable segments.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    # The verify suite spawns many child processes and keeps growing; give Node headroom so a
    # memory spike does not flake the run. Runners have 7GB+, so 4GB is safe on all three OSes.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional: the CLI crash this guards against only reproduces there.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    steps:
      # v5 of both actions: v4 declares node20, which GitHub has deprecated. This is the Node
      # the RUNNER uses for the action, unrelated to node-version below (the Node DaiDocs is tested on).
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run verify
      - run: node tools/check_numbers.mjs

  # The pip-installed `kerneta` CLI (Kerneta-Cai): builds the sdist and wheel, installs the
  # wheel into a fresh venv and drives doctor/build/update/watch from outside the checkout.
  # Kept out of npm run check so the Node suite needs no Python. 3.10 is the minimum supported.
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv "$RUNNER_TEMP/kerneta-test"
      - run: '"$RUNNER_TEMP/kerneta-test/bin/python" -m pip install --disable-pip-version-check build'
      - working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/kerneta-test/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/Kerneta-Cai/tests" -v'
